name: Tests

on: push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --locked
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev liblilv-dev libjson-c-dev pkg-config
      - name: Build native pedal
        run: cmake -S native_pedal -B build/native -DCMAKE_BUILD_TYPE=Release && cmake --build build/native -j 2
      - name: Test native pedal
        run: ctest --test-dir build/native --output-on-failure
      - name: Run tests
        run: uv run python -m unittest discover -s tests
