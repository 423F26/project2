name: C pedal tests
on: push
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev liblilv-dev libjson-c-dev pkg-config cmake jq curl
      - name: Build
        run: cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release && cmake --build build/release -j 2
      - name: Test
        run: ctest --test-dir build/release --output-on-failure
